name: Build and Release APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (release or debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: |
          BUILD_TYPE="${{ inputs.build_type || 'release' }}"
          if [ "$BUILD_TYPE" = "debug" ]; then
            echo "Building FossDebug variant..."
            ./gradlew assembleFossDebug
          else
            echo "Building FossRelease variant (with ProGuard/R8)..."
            ./gradlew assembleFossRelease
          fi

      - name: Prepare and Sign APK
        run: |
          mkdir -p output_apks
          BUILD_TYPE="${{ inputs.build_type || 'release' }}"
          if [ "$BUILD_TYPE" = "debug" ]; then
            echo "Collecting Debug APKs (already signed by Gradle with debug keystore)..."
            for debug_apk in $(find app/build/outputs/apk/ -name "*debug.apk"); do
              echo "Found debug APK: $debug_apk"
              cp "$debug_apk" "output_apks/$(basename "$debug_apk")"
            done
          else
            BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
            echo "Using Build Tools at $BUILD_TOOLS_DIR"
            
            keytool -genkey -v -keystore release-key.jks -alias gallery -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Gallery, OU=Android, O=Goodwy, L=Unknown, S=Unknown, C=US"
            
            for unsigned_apk in $(find app/build/outputs/apk/ -name "*unsigned.apk"); do
              signed_apk="output_apks/$(basename "$unsigned_apk" -unsigned.apk)-signed.apk"
              echo "Signing $unsigned_apk -> $signed_apk"
              $BUILD_TOOLS_DIR/apksigner sign --ks release-key.jks --ks-pass pass:android --ks-key-alias gallery --key-pass pass:android --out "$signed_apk" "$unsigned_apk"
            done
          fi
          
          ls -la output_apks/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gallery-${{ inputs.build_type || 'release' }}-APK
          path: output_apks/*.apk
