name: Build and Release APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build variant (release or debug)'
        required: false
        default: 'release'

permissions:
  contents: write

jobs:
  build:
    if: "github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK (Debug for test branch, Release for others)
        run: |
          if [ "${{ github.ref_name }}" = "test" ]; then
            echo "Building Debug variant for test branch..."
            ./gradlew assembleFossDebug
          else
            echo "Building Release variant..."
            ./gradlew assembleFossRelease
          fi

      - name: Prepare and Sign APK
        run: |
          mkdir -p output_apks
          if [ "${{ github.ref_name }}" = "test" ]; then
            echo "Collecting Debug APKs (already signed by Gradle with debug keystore)..."
            for debug_apk in $(find app/build/outputs/apk/ -name "*debug.apk"); do
              echo "Found debug APK: $debug_apk"
              cp "$debug_apk" "output_apks/$(basename "$debug_apk")"
            done
          else
            BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
            echo "Using Build Tools at $BUILD_TOOLS_DIR"
            
            if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
              echo "Decoding permanent release keystore from GitHub Secrets..."
              echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
              KS_PASS="${{ secrets.RELEASE_KEYSTORE_PASSWORD }}"
              KS_ALIAS="${{ secrets.RELEASE_KEY_ALIAS }}"
              KEY_PASS="${{ secrets.RELEASE_KEY_PASSWORD }}"
            else
              echo "Falling back to ephemeral key..."
              keytool -genkey -v -keystore release.keystore -alias gallery -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Gallery, OU=Android, O=Goodwy, L=Unknown, S=Unknown, C=US"
              KS_PASS="android"
              KS_ALIAS="gallery"
              KEY_PASS="android"
            fi
            
            for unsigned_apk in $(find app/build/outputs/apk/ -name "*unsigned.apk"); do
              signed_apk="output_apks/$(basename "$unsigned_apk" -unsigned.apk)-signed.apk"
              echo "Signing $unsigned_apk -> $signed_apk"
              $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore --ks-pass "pass:$KS_PASS" --ks-key-alias "$KS_ALIAS" --key-pass "pass:$KEY_PASS" --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out "$signed_apk" "$unsigned_apk"
            done
          fi
          
          ls -la output_apks/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gallery-${{ github.ref_name }}-APK
          path: output_apks/*.apk
