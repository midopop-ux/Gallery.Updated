name: Build and Release APK

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK (Debug for test branch, Release for others)
        run: |
          if [ "${{ github.ref_name }}" = "test" ]; then
            echo "Building Debug variant for test branch..."
            ./gradlew assembleFossDebug
          else
            echo "Building Release variant..."
            ./gradlew assembleFossRelease
          fi

      - name: Prepare and Sign APK
        run: |
          mkdir -p output_apks
          if [ "${{ github.ref_name }}" = "test" ]; then
            echo "Collecting Debug APKs (already signed by Gradle with debug keystore)..."
            for debug_apk in $(find app/build/outputs/apk/ -name "*debug.apk"); do
              echo "Found debug APK: $debug_apk"
              cp "$debug_apk" "output_apks/$(basename "$debug_apk")"
            done
          else
            BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
            echo "Using Build Tools at $BUILD_TOOLS_DIR"
            
            keytool -genkey -v -keystore release-key.jks -alias gallery -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Gallery, OU=Android, O=Goodwy, L=Unknown, S=Unknown, C=US"
            
            for unsigned_apk in $(find app/build/outputs/apk/ -name "*unsigned.apk"); do
              signed_apk="output_apks/$(basename "$unsigned_apk" -unsigned.apk)-signed.apk"
              echo "Signing $unsigned_apk -> $signed_apk"
              $BUILD_TOOLS_DIR/apksigner sign --ks release-key.jks --ks-pass pass:android --ks-key-alias gallery --key-pass pass:android --out "$signed_apk" "$unsigned_apk"
            done
          fi
          
          ls -la output_apks/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gallery-${{ github.ref_name }}-APK
          path: output_apks/*.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/unified-gallery' || github.ref == 'refs/heads/test'
        with:
          tag_name: ${{ github.ref_name }}
          name: Gallery ${{ github.ref_name == 'test' && 'Debug Diagnostics Build' || 'Release' }} (${{ github.ref_name }})
          body: |
            ### Gallery APK Build (${{ github.ref_name }})
            - **Variant**: ${{ github.ref_name == 'test' && 'Debug (FOSS) with full line numbers and debuggable mode' || 'Release (FOSS) optimized with R8/Proguard' }}
            - **In-App Crash Reporter**: Integrated `CrashHandler` and `AppLogger` breadcrumbs tracker
            - **Dedicated Crash Process**: Crash screen runs in isolated `:crash` process with one-click Copy / Share report
            - **Native Gallery Picker**: 'Replace Old' uses native chronological Gallery grid instead of folder file-tree
            - **Timestamp Preservation**: Automatically maintains `Date Taken` (EXIF) and `Last Modified` on overwrite
          files: output_apks/*.apk
          draft: false
          prerelease: ${{ github.ref_name == 'test' }}
