name: Build and Release APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (release or debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: |
          BUILD_TYPE="${{ inputs.build_type || 'release' }}"
          if [ "$BUILD_TYPE" = "debug" ]; then
            echo "Building FossDebug variant..."
            ./gradlew assembleFossDebug
          else
            echo "Building FossRelease variant (with ProGuard/R8)..."
            ./gradlew assembleFossRelease
          fi

      - name: Prepare and Sign APK with Universal Keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          mkdir -p output_apks
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Using Build Tools at $BUILD_TOOLS_DIR"
          
          if [ -n "$KEYSTORE_B64" ]; then
            echo "[CI] Using universal release keystore from secrets..."
            echo "$KEYSTORE_B64" | base64 -d > universal-release.keystore
            KS_FILE="universal-release.keystore"
            KS_PASS="$KEYSTORE_PASS"
            KS_ALIAS="$KEY_ALIAS"
            K_PASS="$KEY_PASS"
          else
            echo "[CI] Fallback to generated keystore..."
            keytool -genkey -v -keystore release-key.jks -alias gallery -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Gallery, OU=Android, O=Goodwy, L=Unknown, S=Unknown, C=US"
            KS_FILE="release-key.jks"
            KS_PASS="android"
            KS_ALIAS="gallery"
            K_PASS="android"
          fi
          
          for target_apk in $(find app/build/outputs/apk/ -name "*.apk"); do
            signed_apk="output_apks/$(basename "$target_apk" -unsigned.apk)"
            if [[ "$signed_apk" != *.apk ]]; then signed_apk="${signed_apk}.apk"; fi
            echo "Signing $target_apk -> $signed_apk with $KS_ALIAS"
            $BUILD_TOOLS_DIR/apksigner sign --ks "$KS_FILE" --ks-pass pass:"$KS_PASS" --ks-key-alias "$KS_ALIAS" --key-pass pass:"$K_PASS" --out "$signed_apk" "$target_apk"
          done
          
          rm -f universal-release.keystore release-key.jks
          ls -la output_apks/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gallery-${{ inputs.build_type || 'release' }}-APK
          path: output_apks/*.apk
